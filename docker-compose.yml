services:

  # ── Shared infrastructure ─────────────────────────────────────────────────
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: db
      # Local email goes to Mailpit (below), so notifications and the daily
      # digest can be seen at http://localhost:8025 instead of being skipped.
      # Deployed environments set real SMTP_* values instead.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USE_TLS: "false"
    volumes:
      - ./backend:/app
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # ── Local mailbox ──────────────────────────────────────────────────────────
  # Catches every email the API sends in development; nothing leaves the
  # machine. Inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  # ── React frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # No VITE_API_BASE_URL/VITE_WS_URL here: leaving them unset lets the
      # built bundle derive the backend host from whichever address the
      # browser used to load the page (see frontend/src/lib/api.ts), so it
      # works from other devices on the LAN, not just this machine.
    ports:
      - "5173:3000"
    depends_on:
      - api

volumes:
  db_data:
